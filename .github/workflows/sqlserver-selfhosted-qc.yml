name: SQL Server self-hosted QC

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "src/**"
      - "tests/**"
      - "database/**"
      - "tools/sql-qc/**"
      - ".github/workflows/sqlserver-selfhosted-qc.yml"
      - "CreatorFlow.sln"
      - "*.props"
      - "*.targets"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: creatorflow-sqlserver-qc
  cancel-in-progress: false

jobs:
  sqlserver-qc:
    # No pull_request trigger: never execute untrusted fork code on a local SQL host.
    # Match the exact custom labels configured on the dedicated Z240 SQL runner.
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    env:
      # The runner is local to the SQL Server host. The variable can override
      # localhost for a named local instance, but must not point to a remote host.
      CREATORFLOW_QC_SQL_INSTANCE: ${{ vars.CREATORFLOW_QC_SQL_INSTANCE || 'localhost' }}
      CREATORFLOW_QC_DATABASE: CreatorFlow_QC
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Diagnostic only: this runs under the actual Windows service identity.
      # SQL login failures are reported here; the fail-closed database guard
      # below remains authoritative and is not bypassed.
      - name: Diagnose runner Windows and SQL identity
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host '===== RUNNER WINDOWS IDENTITY ====='
          whoami

          Write-Host '===== RUNNER SQL IDENTITY ====='
          try {
            Import-Module SqlServer -ErrorAction Stop
            $identity = Invoke-Sqlcmd `
              -ServerInstance $env:CREATORFLOW_QC_SQL_INSTANCE `
              -Database master `
              -TrustServerCertificate `
              -Query "SELECT SUSER_SNAME() AS SqlLogin, ORIGINAL_LOGIN() AS OriginalLogin, IS_SRVROLEMEMBER(N'sysadmin') AS IsSysadmin;" `
              -ErrorAction Stop
            $identity | Format-List

  $databasePermissions = Invoke-Sqlcmd `
    -ServerInstance $env:CREATORFLOW_QC_SQL_INSTANCE `
    -Database $env:CREATORFLOW_QC_DATABASE `
    -TrustServerCertificate `
    -Query "SELECT USER_NAME() AS DatabaseUser, IS_MEMBER(N'db_owner') AS IsDbOwner, IS_MEMBER(N'db_ddladmin') AS IsDbDdlAdmin, IS_MEMBER(N'db_datareader') AS IsDbDataReader, IS_MEMBER(N'db_datawriter') AS IsDbDataWriter, HAS_PERMS_BY_NAME(N'dbo',N'SCHEMA',N'ALTER') AS CanAlterDboSchema;" `
    -ErrorAction Stop
  $databasePermissions | Format-List
          }
          catch {
            Write-Warning ("Runner SQL identity probe failed: " + $_.Exception.Message)
            Write-Warning 'The mandatory preflight/database guard will determine whether QC can continue.'
          }

      - name: Preflight, database guard, SQL smoke and tests
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: ./tools/sql-qc/Invoke-SqlServerQc.ps1
