name: CI

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore CreatorFlow.sln
      - run: dotnet build CreatorFlow.sln --configuration Release --no-restore
      - run: dotnet test CreatorFlow.sln --configuration Release --no-build

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ./ai pytest httpx
      - run: pytest ai/tests -q

  powershell:
    name: PowerShell script validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse local setup and SQL scripts
        shell: pwsh
        run: |
          $files = @(
            'scripts/Setup-HPZ240.ps1',
            'scripts/Start-VideoRenderWorker.ps1',
            'scripts/Test-VideoRenderer.ps1',
            'database/Apply-Migrations.ps1',
            'database/Verify-Database.ps1',
            'tools/sql-qc/Invoke-SqlServerQc.ps1',
            'tools/sql-qc/Protect-QcDatabase.ps1',
            'tools/sql-qc/Test-SqlQcPreflight.ps1',
            'scripts/docker/Import-LocalPilotEnv.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}:$($_.Extent.StartLineNumber): $($_.Message)" }
              throw "PowerShell parse failed: $file"
            }
            Write-Host "PASS $file"
          }
