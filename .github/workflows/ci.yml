name: CI

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore CreatorFlow.sln
      - run: dotnet build CreatorFlow.sln --configuration Release --no-restore
      - run: dotnet test CreatorFlow.sln --configuration Release --no-build

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ./ai pytest httpx
      - run: pytest ai/tests -q


  keycloak-live-contract:
    name: Keycloak live OIDC and signed-token contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Start Keycloak with the checked-in realm export
        shell: bash
        run: |
          docker run -d --name creatorflow-keycloak \
            -p 8180:8180 -p 9000:9000 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=ci-admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD='ci-only-admin-password-12345' \
            -e KC_HTTP_PORT=8180 \
            -e KC_HOSTNAME=http://localhost:8180 \
            -e KC_HEALTH_ENABLED=true \
            -v "$PWD/docker/keycloak/realm-import:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:26.8.1 start-dev --import-realm
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/health/ready >/dev/null; then
              break
            fi
            sleep 5
          done
          curl -fsS http://127.0.0.1:9000/health/ready >/dev/null
          curl -fsS http://127.0.0.1:8180/realms/creatorflow/.well-known/openid-configuration >/tmp/creatorflow-oidc.json
          python - <<'PY'
          import json
          metadata = json.load(open('/tmp/creatorflow-oidc.json', encoding='utf-8'))
          expected = 'http://localhost:8180/realms/creatorflow'
          assert metadata['issuer'] == expected, metadata.get('issuer')
          for key in ('authorization_endpoint', 'token_endpoint', 'jwks_uri'):
              assert metadata.get(key), key
          print('PASS imported realm OIDC discovery:', metadata['issuer'])
          PY
      - name: Complete creatorflow-web authorization code and PKCE flow
        shell: bash
        run: |
          python -m pip install --quiet 'PyJWT[crypto]' requests beautifulsoup4
          python - <<'PY'
          import base64, hashlib, json, secrets
          from urllib.parse import urlencode, urljoin, urlparse, parse_qs
          import requests
          from bs4 import BeautifulSoup
          import jwt

          base = 'http://127.0.0.1:8180'
          issuer = 'http://localhost:8180/realms/creatorflow'
          redirect_uri = 'http://127.0.0.1:8765/callback'

          def admin_request(method, path, data=None, token=None):
              headers = {'Authorization': 'Bearer ' + token} if token else {}
              response = requests.request(method, base + path, json=data, headers=headers, timeout=20)
              response.raise_for_status()
              return response.json() if response.content else None

          admin = requests.post(base + '/realms/master/protocol/openid-connect/token', data={
              'client_id': 'admin-cli', 'grant_type': 'password',
              'username': 'ci-admin', 'password': 'ci-only-admin-password-12345'
          }, timeout=20)
          admin.raise_for_status()
          admin_token = admin.json()['access_token']

          clients = admin_request('GET', '/admin/realms/creatorflow/clients?clientId=creatorflow-web', token=admin_token)
          assert clients, 'checked-in creatorflow-web client is missing'
          web_client = clients[0]
          client_uuid = web_client['id']
          assert web_client.get('standardFlowEnabled') is True, 'authorization-code flow is disabled'
          assert web_client.get('directAccessGrantsEnabled') is False, 'password grant must stay disabled'
          assert web_client.get('publicClient') is False, 'creatorflow-web must remain confidential'
          attributes = web_client.get('attributes') or {}
          assert attributes.get('pkce.code.challenge.method') == 'S256', 'PKCE S256 is not configured'
          redirect_uris = web_client.get('redirectUris') or []
          if redirect_uri not in redirect_uris:
              redirect_uris.append(redirect_uri)
              web_client['redirectUris'] = redirect_uris
              admin_request('PUT', f'/admin/realms/creatorflow/clients/{client_uuid}', web_client, admin_token)
          client_secret = admin_request(
              'GET', f'/admin/realms/creatorflow/clients/{client_uuid}/client-secret', token=admin_token
          )['value']
          scopes = admin_request('GET', '/admin/realms/creatorflow/client-scopes', token=admin_token)
          api_scope = next((scope for scope in scopes if scope['name'] == 'creatorflow-api'), None)
          assert api_scope, 'creatorflow-api client scope is missing from imported realm'
          default_scopes = admin_request(
              'GET', f'/admin/realms/creatorflow/clients/{client_uuid}/default-client-scopes',
              token=admin_token
          )
          if not any(scope['id'] == api_scope['id'] for scope in default_scopes):
              admin_request(
                  'PUT', f'/admin/realms/creatorflow/clients/{client_uuid}/default-client-scopes/{api_scope["id"]}',
                  token=admin_token
              )

          users = admin_request(
              'GET', '/admin/realms/creatorflow/users?username=ci-oidc-contract&exact=true', token=admin_token
          )
          if not users:
              admin_request('POST', '/admin/realms/creatorflow/users', {
                  'username': 'ci-oidc-contract', 'enabled': True,
                  'email': 'ci-oidc-contract@example.invalid', 'emailVerified': True,
                  'firstName': 'CI', 'lastName': 'Contract', 'requiredActions': []
              }, admin_token)
              users = admin_request(
                  'GET', '/admin/realms/creatorflow/users?username=ci-oidc-contract&exact=true', token=admin_token
              )
          user_id = users[0]['id']
          admin_request('PUT', f'/admin/realms/creatorflow/users/{user_id}/reset-password', {
              'type': 'password', 'value': 'ci-only-user-password-123456', 'temporary': False
          }, admin_token)

          verifier = secrets.token_urlsafe(64)
          challenge = base64.urlsafe_b64encode(hashlib.sha256(verifier.encode()).digest()).rstrip(b'=').decode()
          state = secrets.token_urlsafe(24)
          nonce = secrets.token_urlsafe(24)
          params = {
              'client_id': 'creatorflow-web',
              'response_type': 'code',
              'redirect_uri': redirect_uri,
              'scope': 'openid',
              'state': state,
              'nonce': nonce,
              'code_challenge': challenge,
              'code_challenge_method': 'S256'
          }

          session = requests.Session()
          login_page = session.get(
              base + '/realms/creatorflow/protocol/openid-connect/auth?' + urlencode(params),
              allow_redirects=False, timeout=20
          )
          for _ in range(5):
              if login_page.is_redirect:
                  next_url = urljoin(login_page.url, login_page.headers['Location'])
                  if next_url.startswith(redirect_uri):
                      raise AssertionError(f'Keycloak rejected the authorization request: {next_url}')
                  login_page = session.get(next_url, allow_redirects=False, timeout=20)
                  continue
              break
          login_page.raise_for_status()
          soup = BeautifulSoup(login_page.text, 'html.parser')
          form = next(
              (candidate for candidate in soup.find_all('form')
               if candidate.find('input', {'name': 'password'})),
              None
          )
          assert form is not None, 'Keycloak did not render the expected login form'
          form_data = {}
          for field in form.find_all('input'):
              name = field.get('name')
              if name and field.get('type', '').lower() == 'hidden':
                  form_data[name] = field.get('value', '')
          form_data['username'] = 'ci-oidc-contract'
          form_data['password'] = 'ci-only-user-password-123456'
          login_action = urljoin(login_page.url, form.get('action') or login_page.url)
          login_response = session.post(login_action, data=form_data, allow_redirects=False, timeout=20)
          assert login_response.status_code in (302, 303), (
              f'Keycloak login did not redirect after credentials: {login_response.status_code}'
          )
          callback = login_response.headers.get('Location', '')
          callback_query = parse_qs(urlparse(callback).query)
          assert callback_query.get('state', [None])[0] == state, 'OIDC state did not round-trip'
          code = callback_query.get('code', [None])[0]
          assert code, f'authorization code missing from callback: {callback}'

          token_response = requests.post(
              base + '/realms/creatorflow/protocol/openid-connect/token',
              data={
                  'grant_type': 'authorization_code',
                  'client_id': 'creatorflow-web',
                  'client_secret': client_secret,
                  'redirect_uri': redirect_uri,
                  'code': code,
                  'code_verifier': verifier
              },
              timeout=20
          )
          token_response.raise_for_status()
          access_token = token_response.json()['access_token']
          metadata = requests.get(
              base + '/realms/creatorflow/.well-known/openid-configuration', timeout=20
          ).json()
          signing_key = jwt.PyJWKClient(metadata['jwks_uri']).get_signing_key_from_jwt(access_token)
          claims = jwt.decode(
              access_token, signing_key.key, algorithms=['RS256'],
              audience='creatorflow-api', issuer=issuer
          )
          assert claims.get('sub'), 'subject claim missing'
          assert 'creatorflow-api' in claims.get('aud', []), claims.get('aud')
          print('PASS creatorflow-web authorization code + PKCE:', claims['iss'], 'aud=creatorflow-api')
          PY
      - name: Stop Keycloak
        if: always()
        run: docker rm -f creatorflow-keycloak || true

  powershell:
    name: PowerShell script validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse local setup and SQL scripts
        shell: pwsh
        run: |
          $files = @(
            'scripts/Setup-HPZ240.ps1',
            'scripts/Start-VideoRenderWorker.ps1',
            'scripts/Test-VideoRenderer.ps1',
            'database/Apply-Migrations.ps1',
            'database/Verify-Database.ps1',
            'tools/sql-qc/Invoke-SqlServerQc.ps1',
            'tools/sql-qc/Protect-QcDatabase.ps1',
            'tools/sql-qc/Test-SqlQcPreflight.ps1',
            'scripts/Test-KeycloakRealmContract.ps1',
            'scripts/Initialize-KeycloakLocal.ps1',
            'scripts/docker/Import-LocalPilotEnv.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}:$($_.Extent.StartLineNumber): $($_.Message)" }
              throw "PowerShell parse failed: $file"
            }
            Write-Host "PASS $file"
          }
          ./scripts/Test-KeycloakRealmContract.ps1
