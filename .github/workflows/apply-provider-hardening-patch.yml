name: Apply provider hardening patch on Z240

on:
  push:
    branches:
      - feature/keycloak-oidc-local
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: provider-hardening-patch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[provider-patch-applied]')
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feature/keycloak-oidc-local
          fetch-depth: 0
          persist-credentials: true

      - name: Detect whether patch is already committed
        id: patch-state
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $appliedCommit = git log -1 --format=%H --fixed-strings --grep='[provider-patch-applied]'
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect patch commit history.' }
          if ($appliedCommit) {
            "already=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Patch is already applied in commit $appliedCommit; skipping git apply."
            exit 0
          }
          "already=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if (-not (Test-Path '.\creatorflow-provider-hardening.patch')) {
            throw 'Patch file is missing from repository root.'
          }
          $status = git status --porcelain
          if ($LASTEXITCODE -ne 0) { throw 'git status failed.' }
          if ($status) { throw "Working tree is not clean; refusing to apply patch: $status" }
          git apply --check .\creatorflow-provider-hardening.patch
          if ($LASTEXITCODE -ne 0) { throw 'git apply --check failed; patch was not applied.' }

      - name: Apply patch
        if: steps.patch-state.outputs.already != 'true'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          git apply .\creatorflow-provider-hardening.patch
          if ($LASTEXITCODE -ne 0) { throw 'git apply failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }

      - name: Test API and build worker
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet test .\tests\CreatorFlow.Api.Tests\CreatorFlow.Api.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'API tests failed; patch will not be committed.' }
          dotnet build .\src\CreatorFlow.Workers\CreatorFlow.Workers.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Worker build failed; patch will not be committed.' }

      - name: Build API and Web
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build .\src\CreatorFlow.Api\CreatorFlow.Api.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'API build failed; deployment was not started.' }
          dotnet build .\src\CreatorFlow.Web\CreatorFlow.Web.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Web build failed; deployment was not started.' }
          $localEnv = 'E:\Projects\CreatorFlow-AI\.env'
          if (-not (Test-Path $localEnv)) { throw "Required local .env file was not found at $localEnv; refusing to stop the running API." }
          Copy-Item -LiteralPath $localEnv -Destination '.\.env' -Force

      - name: Rebuild Web container and restart API
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $localEnv = 'E:\Projects\CreatorFlow-AI\.env'
          docker compose --env-file $localEnv -f .\compose.dev.yaml up --build -d web
          if ($LASTEXITCODE -ne 0) { throw 'Web container rebuild/restart failed; the existing API process was left running.' }

          $apiProcesses = Get-CimInstance Win32_Process -Filter "Name = 'dotnet.exe'" |
            Where-Object { $_.CommandLine -and $_.CommandLine -match 'CreatorFlow\.Api\.csproj' }
          $listenerPids = @(Get-NetTCPConnection -LocalPort 7001 -State Listen -ErrorAction SilentlyContinue | Select-Object -ExpandProperty OwningProcess -Unique)
          $stopPids = @($apiProcesses | Select-Object -ExpandProperty ProcessId) + $listenerPids | Select-Object -Unique
          foreach ($processId in $stopPids) {
            if ($processId -and $processId -ne $PID) { Stop-Process -Id $processId -Force -ErrorAction Stop }
          }

          $env:CREATORFLOW_LOAD_DOTENV = 'true'
          $stdout = Join-Path $env:RUNNER_TEMP 'creatorflow-api.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'creatorflow-api.stderr.log'
          $api = Start-Process -FilePath 'dotnet' -ArgumentList @('run','--no-build','--configuration','Release','--project','src\CreatorFlow.Api\CreatorFlow.Api.csproj','--no-launch-profile') -WorkingDirectory $PWD -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          if (-not $api) { throw 'Could not start the API process.' }

          $healthy = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            try {
              $response = Invoke-WebRequest -Uri 'http://127.0.0.1:7001/health' -TimeoutSec 3
              if ($response.StatusCode -eq 200) { $healthy = $true; break }
            } catch { }
            if ($api.HasExited) { break }
          }
          if (-not $healthy) {
            $tail = if (Test-Path $stderr) { Get-Content $stderr -Tail 60 } else { 'No API stderr log was created.' }
            throw "API did not become healthy on port 7001. ProcessId=$($api.Id). $tail"
          }
          Write-Host "API restarted and healthy. ProcessId=$($api.Id)"

      - name: Commit applied patch
        if: steps.patch-state.outputs.already != 'true'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/design/AS_BUILT_STATUS.md src/CreatorFlow.Api/Discovery/DiscoveryConnectorSettingsEndpoints.cs src/CreatorFlow.Api/Discovery/DiscoverySearchEndpoints.cs src/CreatorFlow.Api/Discovery/ProviderHeaderPolicy.cs src/CreatorFlow.Api/Discovery/SafeProviderHttpClient.cs src/CreatorFlow.Workers/DiscoveryTopicSchedulerWorker.cs tests/CreatorFlow.Api.Tests/CustomDiscoveryProviderEndpointTests.cs tests/CreatorFlow.Api.Tests/Discovery/ProviderHeaderPolicyTests.cs tests/CreatorFlow.Api.Tests/Discovery/SafeProviderHttpClientTests.cs
          git commit -m "Harden custom discovery providers and scheduled discovery [provider-patch-applied]"
          if ($LASTEXITCODE -ne 0) { throw 'git commit failed.' }
          git push origin HEAD:feature/keycloak-oidc-local
          if ($LASTEXITCODE -ne 0) { throw 'git push failed.' }
